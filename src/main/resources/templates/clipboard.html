<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'/' + ${slug} + ' — SonBoard'">SonBoard</title>
    <link rel="stylesheet" th:href="@{/clipboard.css}" />
</head>
<body>

<div class="wrapper">

    <!-- Header bar -->
    <header>
        <div class="brand">
            <span class="brand-icon">📋</span>
            <span class="brand-name">SonBoard</span>
        </div>
        <div class="url-bar">
            <span class="url-prefix" id="urlPrefix"></span>
            <input type="text" id="slugInput" th:value="${slug}"
                   placeholder="enter-board-name" spellcheck="false" />
            <button id="goBtn">Go</button>
        </div>
    </header>

    <!-- Status ribbon -->
    <div id="statusBar" class="status-bar hidden"></div>

    <!-- Main editor -->
    <main>
        <textarea id="editor"
                  th:text="${content}"
                  placeholder="Paste or type anything here — it saves automatically to this URL.&#10;Share the URL with anyone to let them see or edit this clipboard."></textarea>
    </main>

    <!-- Footer toolbar -->
    <footer>
        <div class="footer-left">
            <span id="charCount">0 chars</span>
            <span id="saveStatus" class="save-status"></span>
        </div>
        <div class="footer-right">
            <button id="copyBtn" title="Copy to clipboard">Copy</button>
            <button id="clearBtn" title="Clear board">Clear</button>
            <button id="saveBtn" class="btn-primary">Save</button>
        </div>
    </footer>

</div>

<!-- Pass server-side data to JS -->
<script th:inline="javascript">
    const INITIAL_SLUG    = /*[[${slug}]]*/ 'clipboard';
    const INITIAL_EXISTS  = /*[[${exists}]]*/ false;
</script>
<script th:src="@{/clipboard.js}"></script>

</body>
</html>
